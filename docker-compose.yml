services:
  app:
    image: node:22-bookworm-slim
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    network_mode: host
    environment:
      EXPO_NO_TELEMETRY: "1"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      CHOKIDAR_USEPOLLING: "1"
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - npm-cache:/home/node/.npm
    command: npm start
    stdin_open: true
    tty: true

volumes:
  npm-cache:
