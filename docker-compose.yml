services:
  app:
    image: node:22-bookworm-slim
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    network_mode: host
    environment:
      EXPO_NO_TELEMETRY: "1"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      NPM_CONFIG_CACHE: "/tmp/.npm"
      CHOKIDAR_USEPOLLING: "1"
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
    command: npm start
    stdin_open: true
    tty: true
